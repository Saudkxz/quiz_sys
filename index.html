<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz AMS — Skeletal System</title>
<style>
:root{--bg:#f1f5ef;--paper:#fffef9;--ink:#183b34;--green:#137b68;--line:#d8e3da;--muted:#687b70;--red:#a5453c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.8 Tahoma,Arial,sans-serif}
main{max-width:900px;margin:auto;padding:22px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:24px}
h1{font-size:27px;margin:0}
h2{font-size:23px}
small,.muted{color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:24px;margin:16px 0}
button,select,input{font:inherit}
button{cursor:pointer;min-height:44px;padding:10px 16px;border:1px solid var(--line);border-radius:11px;background:var(--paper);color:var(--ink)}
button.main{background:var(--green);color:white;border-color:var(--green)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e6b55c;outline-offset:3px}
[hidden]{display:none!important}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{display:block;font-size:13px}
select,input[type=text]{width:100%;padding:11px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px}
.prompt{direction:ltr;text-align:left;white-space:pre-line;font-family:Arial,sans-serif;font-size:22px;line-height:1.5}
.option{display:block;width:100%;margin:9px 0;text-align:left;direction:ltr;line-height:1.5}
.option.selected{border-color:var(--green);background:#e4f3e8}
.option.correct{border:2px solid var(--green)}
.option.wrong{border-color:var(--red);background:#fff0ec}
.photos{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:16px 0}
.photo{background:white;padding:0;border:1px solid var(--line);border-radius:12px;max-width:100%;width:100%;overflow:hidden}
.photo img{display:block;width:100%;height:auto}
.diagram{display:block;position:relative;overflow:hidden;background:white;direction:ltr}
.mask{position:absolute;display:grid;place-items:center;background:#e1e4e9;border:1px solid #b5bdc8;overflow:hidden;color:#172b34;font:bold clamp(8px,2vw,16px)/1 Arial,sans-serif;pointer-events:none}
.mask.active{background:#efbd51;border-color:#9b6712}
.feedback{padding:18px;border-radius:12px;background:#e7f2e8;margin:18px 0}
.feedback.bad{background:#fff0ec}
.answer{direction:ltr;text-align:left;font-family:Arial,sans-serif;font-size:19px;font-weight:bold;color:var(--green)}
.explain{white-space:pre-line}
.nav{justify-content:center;margin:17px 0}
.nav button{min-height:33px;padding:3px 10px;font-size:12px}
.nav button.current{border-color:var(--green);background:#e4f3e8}
.score{font:bold 55px Arial,sans-serif;color:var(--green);direction:ltr}
.review{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}
.review summary{cursor:pointer;direction:ltr;text-align:left;font-family:Arial,sans-serif;white-space:pre-line}
.status{font-size:12px;color:var(--muted);min-height:24px}
footer{font-size:13px;color:var(--muted);text-align:center;margin:25px}
footer a{color:var(--green);text-decoration:none}
progress{width:100%;height:8px;accent-color:var(--green)}
dialog{width:min(96vw,1200px);max-height:92vh;border:0;border-radius:14px;padding:15px;background:var(--paper);overflow:auto}
dialog::backdrop{background:#123b34bc}
.close{position:sticky;top:0;z-index:2;margin-bottom:12px}
#zoom-content img{display:block;width:100%;height:auto}
body.dark{--bg:#10231f;--paper:#1a342c;--ink:#eef5ec;--line:#335247;--muted:#b0c6b7;--green:#277e64}
body.dark .feedback,body.dark .option.selected,body.dark .nav button.current{background:#244f3c}
body.dark .feedback.bad,body.dark .option.wrong{background:#512f2d}
body.dark .answer{color:#9bd2b3}
@media(max-width:580px){
main{padding:15px}
.card{padding:18px}
.grid{grid-template-columns:1fr}
.prompt{font-size:19px}
h1{font-size:22px}
.row button{flex:1}
.nav button{flex:0}
}
</style>
</head>
<body class="dark">
<main>
<header>
  <div>
    <h1>Quiz AMS</h1>
    <small dir="ltr">HSF · Skeletal System</small>
  </div>
  <button onclick="document.body.classList.toggle('dark')" aria-label="تبديل المظهر">◐</button>
</header>

<noscript>فعّل JavaScript لتشغيل الكويز.</noscript>

<section id="home">
  <div class="card">
    <h2 id="total">تدريب جميل</h2>
    <p> .. By S3UD ادع لي ولوالديّ .</p>
    <p class="status" id="asset-status" role="status">الصور تتجهز صبرك ..</p>
  </div>

  <div class="card">
    <div class="grid">
      <label>طريقة الحل
        <select id="mode">
          <option value="practice">تدريب — تصحيح فوري</option>
          <option value="exam">اختبار — التصحيح في النهاية</option>
        </select>
      </label>

      <label>نوع الإجابة
        <select id="format">
          <option value="choice">اختيار متعدد</option>
          <option value="recall">استدعاء كتابي</option>
        </select>
      </label>

      <label>الموضوع
        <select id="topic">
          <option value="all">الشابتر كامل</option>
          <option value="types">أنواع العظام</option>
          <option value="skull">الجمجمة والعظم اللامي</option>
          <option value="spine">العمود الفقري</option>
          <option value="thorax">القفص الصدري والقص</option>
          <option value="upper">الطرف العلوي</option>
          <option value="lower">الطرف السفلي والحوض</option>
        </select>
      </label>

      <label>الأسئلة
        <select id="pool">
          <option value="all">كل الأسئلة</option>
          <option value="errors">أخطائي السابقة</option>
        </select>
      </label>

      <label>عدد الأسئلة
        <select id="count">
          <option value="all">كل الفراغات</option>
          <option value="20">٢٠ سؤالًا</option>
          <option value="50">٥٠ سؤالًا</option>
          <option value="100">١٠٠ سؤال</option>
        </select>
      </label>
    </div>

    <p id="history" class="muted"></p>

    <div class="row">
      <button class="main" id="start" onclick="beginQuiz()" disabled>ابدأ التدريب</button>
      <button id="resume" onclick="resumeQuiz()" hidden disabled>متابعة الجلسة</button>
    </div>

    <p id="save-status" class="status">يُحفظ التقدم على هذا الجهاز فقط.</p>
  </div>
</section>

<section id="quiz" hidden>
  <div class="row">
    <button onclick="showHome()">حفظ وخروج</button>
    <b id="position"></b>
  </div>

  <progress id="progress" value="0" max="237"></progress>

  <div class="card">
    <h2 id="prompt" class="prompt" tabindex="-1"></h2>

    <p id="image-guide" class="muted" hidden>
      أكمل التسمية المخفية باللون البرتقالي. اضغط الصورة لتكبيرها.
    </p>

    <div id="question-images" class="photos"></div>
    <div id="answers"></div>
    <div id="feedback" class="feedback" hidden></div>

    <div class="row">
      <button id="previous" onclick="moveTo(S.index-1)">السابق</button>
      <button id="skip" onclick="skipQuestion()">تخطي</button>
      <button id="next" class="main" onclick="nextQuestion()">تحقق</button>
    </div>
  </div>

  <nav id="navigation" class="row nav" aria-label="التنقل بين الأسئلة"></nav>
</section>

<section id="results" hidden>
  <div class="card">
    <div class="score" id="score"></div>
    <p id="result-text"></p>

    <div class="row">
      <button id="retry" class="main" onclick="retryErrors()">إعادة الأخطاء</button>
      <button onclick="beginQuiz(S.order)">إعادة الجلسة</button>
      <button onclick="showHome()">الرئيسية</button>
    </div>

    <div id="review"></div>
  </div>
</section>

<footer>
  <a href="https://t.me/quiz_ams" target="_blank" rel="noopener noreferrer" dir="ltr">
    By quiz_ams ↗
  </a>
</footer>
</main>

<dialog id="zoom">
  <button class="close" onclick="el('zoom').close()">إغلاق</button>
  <div id="zoom-content"></div>
</dialog>

function esc(s){
  return String(s??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

function norm(s){
  return String(s??'')
    .normalize('NFKC')
    .toLowerCase()
    .replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c))
    .replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c))
    .replace(/[\u064b-\u065f\u0670\u0640]/g,'')
    .replace(/[أإآٱ]/g,'ا')
    .replace(/ى/g,'ي')
    .replace(/ة/g,'ه')
    .replace(/[^\p{L}\p{N}\s]/gu,' ')
    .replace(/\b(the|a|an|and)\b/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

const ANSWER_CACHE=new Map();
const NORMAL_CACHE=new Map();

function accepted(a){
  if(ANSWER_CACHE.has(a))return ANSWER_CACHE.get(a);

  const key=norm(a);
  const entry=Object.entries(ALIASES).find(([k,v])=>
    norm(k)===key||v.some(x=>norm(x)===key)
  );

  let values=entry?[entry[0],...entry[1]]:[];

  if(/^\d+$/.test(a)){
    const words={
      1:'one',
      4:'four',
      5:'five',
      7:'seven',
      8:'eight',
      10:'ten',
      11:'eleven',
      12:'twelve',
      33:'thirty three'
    };
    if(words[a])values.push(words[a]);
  }

  values=[...new Set([a,...values])];
  ANSWER_CACHE.set(a,values);
  return values;
}

function answerKeys(a){
  if(!NORMAL_CACHE.has(a)){
    NORMAL_CACHE.set(a,new Set(accepted(a).map(norm)));
  }
  return NORMAL_CACHE.get(a);
}

function equivalent(a,b){
  const xs=answerKeys(a);
  return [...answerKeys(b)].some(x=>xs.has(x));
}

function grade(q,v){
  const key=norm(v);
  return !!key&&answerKeys(q.a).has(key);
}

function topic(n){
  return n<=17?'types':
    n<=31?'skull':
    n<=40?'spine':
    n<=49?'thorax':
    n<=65?'upper':
    n<=79?'lower':
    n<=81?'thorax':
    n===82||n===85||n===86||n===87?'spine':
    n===88||n===92?'lower':'upper';
}

function shuffle(a){
  a=[...a];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function add(q){
  q.g=topic(q.n);
  q.id='n'+q.n+'b'+q.blank;
  Q.push(q);
}

function buildQuestions(){
  for(const[n,text,back,frontPics,backPics]of TEXT){
    const blanks=[...text.matchAll(/{{c(\d+)::([\s\S]*?)}}/g)];

    blanks.forEach((m,j)=>{
      let k=0;

      const p=text.replace(
        /{{c\d+::([\s\S]*?)}}/g,
        (_,a)=>k++===j?'_____':a
      );

      let a=m[2].trim().replace(/[.]$/,'');
      if(a==='Humeru')a='Humerus';

      add({
        n,
        blank:j,
        p,
        a,
        e:back,
        f:frontPics,
        b:backPics
      });
    });
  }

  for(const[n,file,regions,extra,backPics]of IMAGES){
    const used=MASKS[file]??=[];

    regions.forEach((r,j)=>{
      if(!used.some(b=>b.slice(0,4).join()===r.slice(0,4).join())){
        used.push(r);
      }

      add({
        n,
        blank:j,
        p:'Complete the hidden label: _____',
        a:r[4],
        box:r.slice(0,4),
        file,
        e:extra,
        f:[],
        b:backPics
      });
    });
  }

  Q.sort((a,b)=>a.n-b.n||a.blank-b.blank);

  FILES=[...new Set([
    ...TEXT.flatMap(n=>[...n[3],...n[4]]),
    ...IMAGES.flatMap(n=>[n[1],...n[4]])
  ])];
}

        ).map(x=>x.a)
      ),
      ...shuffle(IMAGES.flatMap(n=>n[2].map(r=>r[4])))
    ];
  }

  const options=[q.a];

  for(const a of pool){
    if(!options.some(v=>equivalent(a,v))){
      options.push(a);
    }
    if(options.length===4)break;
  }

  return shuffle(options);
}

function validSession(s){
  return s&&
    ['practice','exam'].includes(s.mode)&&
    ['choice','recall'].includes(s.format)&&
    !s.finished&&
    Array.isArray(s.order)&&
    s.order.length&&
    new Set(s.order).size===s.order.length&&
    s.order.every(i=>Number.isInteger(i)&&Q[i])&&
    Number.isInteger(s.index)&&
    s.index>=0&&
    s.index<s.order.length&&
    s.answers&&
    typeof s.answers==='object'&&
    s.options&&
    s.order.every(i=>
      Array.isArray(s.options[i])&&
      s.options[i].every(v=>typeof v==='string')&&
      s.options[i].some(v=>grade(Q[i],v))
    )&&
    Object.values(s.answers).every(a=>
      a&&typeof a.value==='string'
    );
}

function restore(){
  try{
    const old=JSON.parse(localStorage.getItem(KEY)||'null');

    if(old&&old.stats&&typeof old.stats==='object'){
      cacheState.stats=Object.fromEntries(
        Object.entries(old.stats).filter(([id,v])=>
          Q.some(q=>q.id===id)&&typeof v==='boolean'
        )
      );

      if(validSession(old.session)){
        S=old.session;
      }
    }
  }catch(_){}
}

function save(){
  cacheState.session=S&&!S.finished?S:null;

  try{
    localStorage.setItem(KEY,JSON.stringify(cacheState));
  }catch(_){
    el('save-status').textContent=
      'التقدم متاح لهذه الجلسة فقط؛ تعذّر حفظه على الجهاز.';
  }
}

function show(name){
  el('zoom').close();

  ['home','quiz','results'].forEach(id=>{
    el(id).hidden=id!==name;
  });

  window.scrollTo({top:0,behavior:'auto'});
}

function showHome(){
  save();
  show('home');

  el('total').textContent=
    Q.length+' سؤالًا من فراغات الرزمة كاملة';

  el('resume').hidden=!S||S.finished;
  el('resume').disabled=!assetReady;

  el('history').textContent=
    'أسئلة تحتاج مراجعة: '+
    Object.values(cacheState.stats).filter(v=>!v).length+
    ' من '+Q.length;
}

function beginQuiz(ids){
  if(!assetReady)return;

  const previous=S;
  const repeat=!!previous&&ids===previous.order;

  if(!ids){
    ids=Q.map((_,i)=>i).filter(i=>
      (el('topic').value==='all'||Q[i].g===el('topic').value)&&
      (el('pool').value==='all'||cacheState.stats[Q[i].id]===false)
    );

    if(S&&!S.finished&&!confirm(
      'بدء جلسة جديدة بدل الجلسة غير المكتملة؟'
    )){
      return;
    }

    ids=shuffle(ids);

    if(el('count').value!=='all'){
      ids=ids.slice(0,Number(el('count').value));
    }
  }

  if(!ids.length){
    alert('لا توجد أسئلة لهذا الاختيار.');
    return;
  }

  S={
    order:shuffle(ids),
    index:0,
    mode:repeat?previous.mode:el('mode').value,
    format:repeat?previous.format:el('format').value,
    answers:{},
    options:Object.fromEntries(
      ids.map(i=>[i,makeOptions(Q[i])])
    ),
    finished:false
  };

  save();
  show('quiz');
  renderQuestion();
}

function resumeQuiz(){
  if(!S||!assetReady)return;
  show('quiz');
  renderQuestion();
}

function current(){
  return Q[S.order[S.index]];
}

function diagram(q,reveal=false){
  let masks='';

  for(const r of MASKS[q.file]){
    const active=r.slice(0,4).join()===q.box.join();

    if(active&&reveal)continue;

    const pad=.0035;
    const x=Math.max(0,r[0]-pad);
    const y=Math.max(0,r[1]-pad);
    const w=Math.min(1-x,r[0]+r[2]+pad-x);
    const h=Math.min(1-y,r[1]+r[3]+pad-y);

    masks+=
      '<span class="mask '+(active?'active':'')+'" '+
      'style="left:'+x*100+'%;top:'+y*100+'%;'+
      'width:'+w*100+'%;height:'+h*100+'%" '+
      'aria-hidden="true">'+
      (active?'?':'')+
      '</span>';
  }

  return '<span class="diagram">'+
    '<img src="'+assetURLs[q.file]+'" '+
    'alt="صورة السؤال مع مناطق مغطاة">'+
    masks+
    '</span>';
}

function photo(file){
  if(!assetURLs[file])return '';

  return '<button class="photo" '+
    'onclick="zoomPhoto(\''+esc(file)+'\')" '+
    'aria-label="تكبير الصورة">'+
    '<img src="'+assetURLs[file]+'" '+
    'alt="صورة من الرزمة" loading="lazy">'+
    '</button>';
}

function questionPhoto(q,reveal=false){
  if(q.file){
    return '<button class="photo" '+
      'onclick="zoomQuestion('+Q.indexOf(q)+','+reveal+')" '+
      'aria-label="تكبير الصورة المعماة">'+
      diagram(q,reveal)+
      '</button>';
  }

  return q.f.map(photo).join('');
}

function zoomPhoto(file){
  if(!assetURLs[file])return;

  el('zoom-content').innerHTML=
    '<img src="'+assetURLs[file]+'" alt="صورة من الملف">';

  el('zoom').showModal();
}

function zoomQuestion(i,reveal){
  const q=Q[i];
  if(!q?.file)return;

  if(
    !S?.finished&&
    !(S?.mode==='practice'&&S.answers[q.id]?.done)
  ){
    reveal=false;
  }

  el('zoom-content').innerHTML=diagram(q,reveal);
  el('zoom').showModal();
}

function creditButton(q,a){
  if(
    S.format!=='recall'||
    a.correct||
    a.skip||
    !a.value.trim()
  ){
    return '';
  }

  return '<p><small>'+
    'إذا جوابك كان بنفس المعنى ولكن صيغة مختلفة فما فيه اشكال.'+
    '</small></p>'+
    '<button onclick="selfCredit(\''+q.id+'\')">'+
    'إجابتي تحمل المعنى نفسه'+
    '</button>';
}

function renderQuestion(){
  const q=current();
  const a=S.answers[q.id];
  const locked=S.mode==='practice'&&a?.done;
  const typed=S.format==='recall';

  el('prompt').textContent=q.p;
  el('image-guide').hidden=!q.file;
  el('position').textContent=(S.index+1)+' / '+S.order.length;

  el('question-images').innerHTML=
    questionPhoto(q,!!locked);

  if(typed){
    el('answers').innerHTML=
      '<label>أكمل الفراغ'+
      '<input id="typed" type="text" dir="auto" '+
      'maxlength="400" autocomplete="off" spellcheck="false" '+
      'value="'+esc(a?.value||'')+'" '+
      (locked?'disabled':'')+
      ' oninput="writeAnswer(this.value)" '+
      'onkeydown="if(event.key===\'Enter\'){'+
      'event.preventDefault();nextQuestion()}">'+
      '</label>';
  }
  else{
    el('answers').innerHTML=
      S.options[S.order[S.index]].map((v,i)=>
        '<button class="option '+
        (a?.value===v?'selected ':'')+
        (locked&&grade(q,v)?'correct ':'')+
        (locked&&a?.value===v&&!a.correct?'wrong':'')+
        '" '+(locked?'disabled':'')+
        ' onclick="choose('+i+')">'+
        esc(v)+
        '</button>'
      ).join('');
  }

  el('feedback').hidden=!locked;
  el('feedback').className=
    'feedback '+(locked&&!a.correct?'bad':'');

  el('feedback').innerHTML=locked?
    '<b>'+
    (
      a.skip?'لم تُجب':
      a.correct?'إجابة صحيحة'+(a.manual?' · تقييم ذاتي':''):
      'تحتاج مراجعة'
    )+
    '</b>'+
    '<div class="answer">'+esc(q.a)+'</div>'+
    '<p class="explain" dir="auto">'+esc(q.e)+'</p>'+
    creditButton(q,a)+
    '<div class="photos">'+q.b.map(photo).join('')+'</div>'
    :'';

  el('previous').disabled=S.index===0;
  el('skip').hidden=locked;

  el('next').disabled=
    S.mode==='practice'&&!locked&&!a?.value?.trim();

  el('next').textContent=
    locked||S.mode==='exam'?
      (S.index===S.order.length-1?'عرض النتيجة':'التالي'):
      'تاكد من جوابك';

  el('progress').max=S.order.length;

  el('progress').value=S.order.filter(i=>
    S.answers[Q[i].id]?.done||S.answers[Q[i].id]?.value
  ).length;

  const from=Math.max(0,S.index-7);
  const to=Math.min(S.order.length,from+15);

  el('navigation').innerHTML=
    S.order.slice(from,to).map((_,j)=>{
      const i=from+j;

      return '<button class="'+
        (i===S.index?'current':'')+
        '" onclick="moveTo('+i+')" '+
        'aria-label="السؤال '+(i+1)+'">'+
        (i+1)+
        '</button>';
    }).join('');

  el('prompt').focus({preventScroll:true});
}

function writeAnswer(value){
  const q=current();

  if(S.mode==='practice'&&S.answers[q.id]?.done)return;

  S.answers[q.id]={
    value,
    done:false,
    correct:false,
    skip:false
  };

  save();

  el('next').disabled=
    S.mode==='practice'&&!value.trim();
}

function choose(i){
  writeAnswer(S.options[S.order[S.index]][i]);
  renderQuestion();
}

function moveTo(i){
  if(i<0||i>=S.order.length)return;

  S.index=i;
  save();
  el('zoom').close();
  renderQuestion();
}

function nextQuestion(){
  const q=current();
  const a=S.answers[q.id];

  if(S.mode==='practice'&&!a?.done){
    if(!a?.value?.trim())return;

    a.correct=grade(q,a.value);
    a.done=true;

    save();
    renderQuestion();
    return;
  }

  if(S.index<S.order.length-1){
    moveTo(S.index+1);
  }else{
    finishQuiz();
  }
}

function skipQuestion(){
  const q=current();

  S.answers[q.id]={
    value:'',
    done:S.mode==='practice',
    correct:false,
    skip:true
  };

  save();

  if(S.index<S.order.length-1){
    moveTo(S.index+1);
  }else{
    finishQuiz();
  }
}

function finishQuiz(){
  const missing=S.order.filter(i=>
    !S.answers[Q[i].id]?.value?.trim()
  ).length;

  if(missing&&!confirm(
    'تسليم الجلسة مع '+missing+' أسئلة دون إجابة؟'
  )){
    return;
  }

  for(const i of S.order){
    const q=Q[i];
    const a=S.answers[q.id]||{value:'',skip:true};

    if(!a.value.trim())a.skip=true;

    if(!a.done||S.mode==='exam'){
      a.correct=!a.skip&&grade(q,a.value);
      a.manual=false;
    }

    a.done=true;
    S.answers[q.id]=a;
    cacheState.stats[q.id]=!!a.correct;
  }

  S.finished=true;
  save();
  show('results');
  renderResults();
}

function renderResults(){
  const correct=S.order.filter(i=>
    S.answers[Q[i].id].correct
  ).length;

  const manual=S.order.filter(i=>
    S.answers[Q[i].id].manual
  ).length;

  el('score').textContent=
    Math.round(correct/S.order.length*100)+'%';

  el('result-text').textContent=
    correct+' إجابات صحيحة من '+S.order.length+
    (manual?' · منها '+manual+' بتقييم ذاتي':'');

  el('retry').disabled=correct===S.order.length;

  el('review').innerHTML=S.order.map(i=>{
    const q=Q[i];
    const a=S.answers[q.id];

    return '<details class="review">'+
      '<summary>'+
      (a.correct?'✓ ':'✗ ')+esc(q.p)+
      '</summary>'+
      '<p>إجابتك: <b dir="auto">'+
      esc(a.value||'ما جاوبتك')+
      '</b>'+
      (a.manual?' (تقييم ذاتي)':'')+
      '</p>'+
      '<div class="answer">'+esc(q.a)+'</div>'+
      '<p class="explain" dir="auto">'+esc(q.e)+'</p>'+
      creditButton(q,a)+
      '<div class="photos">'+
      questionPhoto(q,true)+q.b.map(photo).join('')+
      '</div>'+
      '</details>';
  }).join('');
}

function selfCredit(id){
  const a=S.answers[id];

  if(
    S.format!=='recall'||
    !a||
    a.correct||
    a.skip||
    !a.value.trim()
  ){
    return;
  }

  a.correct=true;
  a.done=true;
  a.manual=true;

  if(S.finished){
    cacheState.stats[id]=true;
    save();
    renderResults();
  }else{
    save();
    renderQuestion();
  }
}

function retryErrors(){
  const ids=S.order.filter(i=>
    !S.answers[Q[i].id].correct
  );

  el('mode').value=S.mode;
  el('format').value=S.format;

  beginQuiz(ids);
}

// قراءة الصور من APKG دون مكتبات خارجية.
function readZip(bytes){
  const v=new DataView(
    bytes.buffer,
    bytes.byteOffset,
    bytes.byteLength
  );

  const n=bytes.length;
  const decoder=new TextDecoder();
  const entries=new Map();
  let end=-1;

  for(let p=n-22;p>=Math.max(0,n-65557);p--){
    if(
      v.getUint32(p,true)===0x06054b50&&
      p+22+v.getUint16(p+20,true)===n
    ){
      end=p;
      break;
    }
  }

  if(end<0)throw Error('تدريب غير سليمة.');

  let p=v.getUint32(end+16,true);
  const count=v.getUint16(end+10,true);

  for(let i=0;i<count;i++){
    if(
      p+46>n||
      v.getUint32(p,true)!==0x02014b50
    ){
      throw Error('رزمة غير سليمة.');
    }

    const flags=v.getUint16(p+8,true);
    const method=v.getUint16(p+10,true);
    const size=v.getUint32(p+20,true);
    const nameLength=v.getUint16(p+28,true);
    const extra=v.getUint16(p+30,true);
    const comment=v.getUint16(p+32,true);
    const offset=v.getUint32(p+42,true);

    const name=decoder.decode(
      bytes.subarray(p+46,p+46+nameLength)
    );

    entries.set(name,{flags,method,size,offset});
    p+=46+nameLength+extra+comment;
  }

  return async name=>{
    const e=entries.get(name);

    if(!e||e.flags&1){
      throw Error('وسائط الرزمة غير مكتملة.');
    }

    const p=e.offset;

    if(
      p+30>n||
      v.getUint32(p,true)!==0x04034b50
    ){
      throw Error('ملف غير سليم.');
    }

    const start=
      p+30+
      v.getUint16(p+26,true)+
      v.getUint16(p+28,true);

    if(start+e.size>n){
      throw Error('ملف غير مكتمل.');
    }

    const raw=bytes.subarray(start,start+e.size);

    if(e.method===0)return raw;

    if(e.method===8){
      const stream=new Blob([raw]).stream().pipeThrough(
        new DecompressionStream('deflate-raw')
      );

      return new Uint8Array(
        await new Response(stream).arrayBuffer()
      );
    }

    throw Error('مشكلة comp.');
  };
}

async function extractImages(file){
  const read=readZip(
    new Uint8Array(await file.arrayBuffer())
  );

  const mapping=JSON.parse(
    new TextDecoder().decode(await read('media'))
  );

  const byName=new Map(
    Object.entries(mapping).map(([k,name])=>[name,k])
  );

  const blobs={};
  let done=0;

  for(const name of FILES){
    const entry=byName.get(name);

    if(entry===undefined){
      throw Error('استخدم التدريب الجديد.');
    }

    const suffix=name.split('.').pop().toLowerCase();

    const mime={
      gif:'image/gif',
      png:'image/png',
      jpg:'image/jpeg',
      jpeg:'image/jpeg',
      webp:'image/webp'
    }[suffix];

    if(!mime){
      throw Error('مشكلة بالصورة seg.');
    }

    blobs[name]=new Blob(
      [await read(entry)],
      {type:mime}
    );

    el('asset-status').textContent=
      'تجهيز الصور: '+(++done)+' / '+FILES.length;
  }

  return blobs;
}

function installAssets(blobs){
  if(!FILES.every(k=>
    blobs[k] instanceof Blob&&
    blobs[k].size&&
    blobs[k].type.startsWith('image/')
  )){
    return false;
  }

  Object.values(assetURLs).forEach(u=>{
    URL.revokeObjectURL(u);
  });

  assetURLs=Object.fromEntries(
    FILES.map(k=>[k,URL.createObjectURL(blobs[k])])
  );

  assetReady=true;
  el('start').disabled=false;
  el('resume').disabled=false;

  return true;
}

function assetDB(mode,blobs){
  return new Promise(resolve=>{
    let db;
    let finished=false;

    const end=value=>{
      if(finished)return;

      finished=true;
      clearTimeout(timer);
      db?.close();
      resolve(value);
    };

    const timer=setTimeout(()=>end(null),6000);

    try{
      const r=indexedDB.open(ASSET_DB,1);

      r.onerror=r.onblocked=()=>end(null);

      r.onupgradeneeded=()=>{
        r.result.createObjectStore('images');
      };

      r.onsuccess=()=>{
        db=r.result;

        if(finished){
          db.close();
          return;
        }

        const tx=db.transaction(
          'images',
          mode==='write'?'readwrite':'readonly'
        );

        const store=tx.objectStore('images');
        const result={};

        if(mode==='write'){
          for(const k of FILES){
            store.put(blobs[k],k);
          }
        }else{
          for(const k of FILES){
            const get=store.get(k);
            get.onsuccess=()=>result[k]=get.result;
          }
        }

        tx.oncomplete=()=>end(
          mode==='write'?true:result
        );

        tx.onerror=tx.onabort=()=>end(null);
      };
    }catch(_){
      end(null);
    }
  });
}

async function loadPublishedDeck(){
  if(loading)return;

  loading=true;
  el('asset-status').textContent='التدريب يتجهز ، صبرك…';

  try{
    const cached=await assetDB('read');

    if(cached&&installAssets(cached)){
      el('asset-status').textContent='التدريب جاهز.';
      return;
    }

    const response=await fetch(
      new URL(DECK_FILE,window.location.href),
      {cache:'no-cache'}
    );

    if(!response.ok){
      throw Error('مشكلة برمجية .');
    }

    const blobs=await extractImages(await response.blob());

    if(!installAssets(blobs)){
      throw Error('فيه مشكلة بقراءة الصور.');
    }

    el('asset-status').textContent='التدريب جاهز.';
    await assetDB('write',blobs);

  }catch(error){
    el('asset-status').innerHTML=
      esc(error.message)+
      ' <button onclick="loadPublishedDeck()">'+
      'عيد المحاولة'+
      '</button>';

  }finally{
    loading=false;
  }
}

async function boot(){
  try{
    const bytes=Uint8Array.from(
      atob(DATA),
      c=>c.charCodeAt(0)
    );

    const stream=new Blob([bytes]).stream().pipeThrough(
      new DecompressionStream('gzip')
    );

    const source=JSON.parse(
      await new Response(stream).text()
    );

    TEXT=source.text;
    IMAGES=source.images;

    buildQuestions();
    restore();
    showHome();

    await loadPublishedDeck();

  }catch(error){
    el('asset-status').textContent=
      'فيه مشكلة. جرب افتح الرابط بمتصفح ثاني.';
  }
}

const bootPromise=boot();
